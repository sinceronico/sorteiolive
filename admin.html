<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel Admin - Conexão Live TikTok</title>
  <script src="https://cdn.socket.io/4.7.4/socket.io.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .card {
      background-color: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 24px;
      width: 100%;
      max-width: 500px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
    }

    h2 {
      margin-bottom: 20px;
      font-size: 1.4rem;
      color: #38bdf8;
      text-align: center;
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-size: 0.875rem;
      color: #94a3b8;
    }

    input[type="text"] {
      width: 100%;
      padding: 10px 14px;
      background-color: #0f172a;
      border: 1px solid #475569;
      border-radius: 6px;
      color: #fff;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="text"]:focus {
      border-color: #38bdf8;
    }

    .btn {
      width: 100%;
      padding: 12px;
      background-color: #0284c7;
      color: white;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn:hover {
      background-color: #0369a1;
    }

    .status-badge {
      margin-top: 20px;
      padding: 10px;
      border-radius: 6px;
      text-align: center;
      font-weight: 600;
      font-size: 0.9rem;
      background-color: #334155;
      color: #cbd5e1;
    }

    .status-badge.connected {
      background-color: #065f46;
      color: #34d399;
    }

    .status-badge.error {
      background-color: #881337;
      color: #f87171;
    }

    .gift-log {
      margin-top: 20px;
      background-color: #0f172a;
      border-radius: 6px;
      padding: 12px;
      max-height: 200px;
      overflow-y: auto;
      font-size: 0.85rem;
    }

    .gift-item {
      padding: 6px 0;
      border-bottom: 1px solid #1e293b;
      color: #fbbf24;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>📡 Conexão TikTok Live</h2>

    <div class="form-group">
      <label for="streamerInput">Usuário do TikTok (@):</label>
      <input type="text" id="streamerInput" placeholder="Ex: gabriellymntro">
    </div>

    <div class="form-group">
      <label for="sessionIdInput">TikTok Session ID (Evita bloqueios):</label>
      <input type="text" id="sessionIdInput" placeholder="Cole seu sessionid dos cookies do TikTok...">
    </div>

    <button class="btn" onclick="connectLive()">Conectar Live</button>

    <div id="statusBox" class="status-badge">Desconectado</div>

    <h3 style="margin-top: 20px; font-size: 1rem; color: #94a3b8;">🎁 Presentes Recebidos:</h3>
    <div id="giftLog" class="gift-log">
      <div style="color: #64748b;">Nenhum presente recebido ainda.</div>
    </div>
  </div>

  <script>
    // ALTERE AQUI PARA A URL DO SEU BACKEND NO RENDER
    const RENDER_URL = 'https://sorteio-backend-live.onrender.com'; 

    const socket = io(RENDER_URL);

    // Carrega o Session ID salvo previamente no navegador
    window.onload = () => {
      const savedSession = localStorage.getItem('tiktok_session_id');
      if (savedSession) {
        document.getElementById('sessionIdInput').value = savedSession;
      }
    };

    function connectLive() {
      const username = document.getElementById('streamerInput').value.trim();
      const sessionId = document.getElementById('sessionIdInput').value.trim();

      if (!username) {
        alert('Por favor, informe o usuário do TikTok.');
        return;
      }

      // Salva o Session ID no navegador para não precisar colar toda vez
      if (sessionId) {
        localStorage.setItem('tiktok_session_id', sessionId);
      } else {
        localStorage.removeItem('tiktok_session_id');
      }

      updateStatus('Conectando...', '');

      // Envia evento para o backend
      socket.emit('setLiveUser', {
        username: username,
        sessionId: sessionId
      });
    }

    // Atualizações de Status vindas do Server
    socket.on('statusUpdate', (data) => {
      if (data.status === 'connected') {
        updateStatus(`✅ Conectado a @${data.streamer}`, 'connected');
      } else if (data.status === 'error') {
        updateStatus(`❌ Erro: ${data.message || 'Falha ao conectar'}`, 'error');
      } else if (data.status === 'ended') {
        updateStatus(`🔴 Live de @${data.streamer} encerrada`, 'error');
      }
    });

    // Recebe Presentes do Server
    socket.on('giftReceived', (data) => {
      console.log('🎁 Presente recebido:', data);
      
      const giftLog = document.getElementById('giftLog');
      
      // Limpa mensagem inicial se houver
      if (giftLog.innerHTML.includes('Nenhum presente')) {
        giftLog.innerHTML = '';
      }

      const item = document.createElement('div');
      item.className = 'gift-item';
      item.innerHTML = `🎁 <strong>@${data.username}</strong> enviou <strong>${data.coins}</strong> moeda(s)!`;
      
      giftLog.prepend(item);

      // Aqui você pode chamar sua função handleGift existente para registrar na rifa/sorteio
      if (typeof handleGift === 'function') {
        handleGift(data.username, data.coins);
      }
    });

    function updateStatus(text, className) {
      const statusBox = document.getElementById('statusBox');
      statusBox.innerText = text;
      statusBox.className = `status-badge ${className}`;
    }
  </script>
</body>
</html>
