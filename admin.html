<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel de Premios</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Socket.io -->
  <script src="/socket.io/socket.io.js"></script>
  <!-- Firebase App & Database (CDN Modular / Compat) -->
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
  <style>
    /* Animação suave para a transição da barra de progresso */
    #barraProgressoMeta {
      transition: width 0.5s ease-in-out, background-color 0.5s ease-in-out;
    }
  </style>
</head>
<body class="bg-gray-950 text-white min-h-screen font-sans flex flex-col">

  <!-- HEADER -->
  <header class="bg-gray-900 border-b border-gray-800 py-4 px-6 flex justify-between items-center shadow-lg">
    <h1 class="text-xl font-bold text-yellow-500 tracking-wide uppercase flex items-center gap-2">
      ⚡ Painel Admin - Sorteio em Live
    </h1>
    <div id="statusConexao" class="text-xs px-3 py-1 rounded-full bg-red-900/60 text-red-300 border border-red-700">
      Desconectado
    </div>
  </header>

  <!-- CONTEÚDO PRINCIPAL -->
  <main class="flex-1 p-6 max-w-7xl w-full mx-auto grid grid-cols-1 lg:grid-cols-3 gap-6">

    <!-- COLUNA DA ESQUERDA: ROLETA E CONTROLES DE META -->
    <div class="lg:col-span-2 flex flex-col items-center justify-start bg-gray-900 p-6 rounded-2xl border border-gray-800 shadow-2xl">
      
      <!-- ÁREA DA ROLETA -->
      <div class="relative w-full flex flex-col items-center justify-center my-4">
        <canvas id="roletaCanvas" width="450" height="450" class="max-w-full drop-shadow-[0_0_15px_rgba(234,179,8,0.2)]"></canvas>
      </div>

      <!-- BOTÃO DE REALIZAR SORTEIO -->
      <button 
        id="btnSortear" 
        onclick="realizarSorteio()"
        class="w-full max-w-md py-4 bg-gradient-to-r from-yellow-500 to-amber-600 hover:from-yellow-400 hover:to-amber-500 text-gray-950 font-black text-xl uppercase rounded-xl shadow-lg transform transition active:scale-95 hover:shadow-yellow-500/20"
      >
        🎯 Realizar Sorteio
      </button>

      <!-- BARRA DE META DE MOEDAS (LOCALIZADA LOGO ABAIXO DO BOTÃO) -->
      <div class="w-full max-w-md mt-6 p-4 bg-gray-900/90 rounded-xl border border-gray-800 shadow-md">
        
        <!-- Configuração da Meta -->
        <div class="flex items-center justify-between gap-4 mb-3">
          <label for="inputMetaMoedas" class="text-sm font-semibold text-gray-300">
            Meta de Moedas:
          </label>
          <div class="flex items-center gap-2">
            <input 
              type="number" 
              id="inputMetaMoedas" 
              value="1000" 
              min="1" 
              class="w-28 px-3 py-1 bg-gray-950 border border-gray-700 rounded-lg text-white font-bold text-right focus:outline-none focus:border-yellow-500 transition"
              onchange="atualizarBarraMeta()"
              oninput="atualizarBarraMeta()"
            />
            <span class="text-sm text-gray-400">moedas</span>
          </div>
        </div>

        <!-- Indicador de Status/Porcentagem -->
        <div class="flex justify-between items-center text-xs text-gray-400 mb-1">
          <span>Acumulado Atual</span>
          <span id="textoStatusMeta" class="font-bold text-yellow-400">0 / 1000 (0%)</span>
        </div>

        <!-- Barra de Progresso Horizontal -->
        <div class="w-full bg-gray-950 h-5 rounded-full overflow-hidden p-1 border border-gray-800 relative">
          <div 
            id="barraProgressoMeta" 
            class="bg-gradient-to-r from-yellow-500 to-amber-400 h-full rounded-full shadow-lg"
            style="width: 0%"
          ></div>
        </div>

      </div>

    </div>

    <!-- COLUNA DA DIREITA: LISTA DE PARTICIPANTES -->
    <div class="bg-gray-900 p-6 rounded-2xl border border-gray-800 shadow-2xl flex flex-col h-[650px]">
      <div class="flex justify-between items-center mb-4">
        <h2 class="text-lg font-bold text-white flex items-center gap-2">
          👥 Participantes (<span id="totalParticipantes">0</span>)
        </h2>
        <button 
          onclick="limparParticipantes()" 
          class="text-xs bg-red-950 hover:bg-red-900 text-red-300 px-3 py-1.5 rounded-lg border border-red-800 transition"
        >
          Limpar Lista
        </button>
      </div>

      <!-- Tabela de Participantes -->
      <div class="flex-1 overflow-y-auto pr-1">
        <table class="w-full text-left text-sm text-gray-300">
          <thead class="text-xs uppercase bg-gray-950 text-gray-400 sticky top-0">
            <tr>
              <th class="p-2 rounded-l-lg">Usuário</th>
              <th class="p-2 text-center">Moedas</th>
              <th class="p-2 text-right rounded-r-lg">Tickets</th>
            </tr>
          </thead>
          <tbody id="tabelaParticipantes" class="divide-y divide-gray-800">
            <!-- Linhas geradas via JavaScript -->
          </tbody>
        </table>
      </div>
    </div>

  </main>

  <!-- LÓGICA E CONEXÃO -->
  <script>
    // 1. Configuração do Firebase
    const firebaseConfig = {
      apiKey: "SUA_API_KEY",
      authDomain: "SEU_PROJECT_ID.firebaseapp.com",
      databaseURL: "https://SEU_PROJECT_ID-default-rtdb.firebaseio.com",
      projectId: "SEU_PROJECT_ID",
      storageBucket: "SEU_PROJECT_ID.appspot.com",
      messagingSenderId: "SEU_SENDER_ID",
      appId: "SEU_APP_ID"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // 2. Conexão Socket.io
    const socket = io();

    // Estado da aplicação
    let participantes = [];
    let totalMoedasAcumuladas = 0;

    const statusConexao = document.getElementById('statusConexao');
    const tabelaParticipantes = document.getElementById('tabelaParticipantes');
    const totalParticipantesEl = document.getElementById('totalParticipantes');

    // Eventos de Conexão
    socket.on('connect', () => {
      statusConexao.innerText = "Conectado ao Servidor";
      statusConexao.className = "text-xs px-3 py-1 rounded-full bg-emerald-900/60 text-emerald-300 border border-emerald-700";
    });

    socket.on('disconnect', () => {
      statusConexao.innerText = "Desconectado";
      statusConexao.className = "text-xs px-3 py-1 rounded-full bg-red-900/60 text-red-300 border border-red-700";
    });

    // Sincronização em Tempo Real via Firebase e Socket
    db.ref('participantes').on('value', (snapshot) => {
      const data = snapshot.val() || {};
      participantes = Object.keys(data).map(key => ({
        id: key,
        ...data[key]
      }));

      renderizarTabela();
      calcularTotalMoedas();
      desenharRoleta();
    });

    // Renderiza a Tabela
    function renderizarTabela() {
      tabelaParticipantes.innerHTML = '';
      totalParticipantesEl.innerText = participantes.length;

      participantes.forEach(p => {
        const tr = document.createElement('tr');
        tr.className = 'hover:bg-gray-800/50 transition';
        tr.innerHTML = `
          <td class="p-2 font-medium text-white">${p.nome || p.username}</td>
          <td class="p-2 text-center text-yellow-400 font-bold">${p.moedas || 0}</td>
          <td class="p-2 text-right text-amber-500 font-bold">${p.tickets || 1}</td>
        `;
        tabelaParticipantes.appendChild(tr);
      });
    }

    // 3. Lógica da Barra de Progresso da Meta
    function calcularTotalMoedas() {
      // Soma o total de moedas registradas entre os participantes ativas
      totalMoedasAcumuladas = participantes.reduce((acc, p) => acc + Number(p.moedas || 0), 0);
      atualizarBarraMeta();
    }

    function atualizarBarraMeta() {
      const inputMeta = document.getElementById('inputMetaMoedas');
      const barra = document.getElementById('barraProgressoMeta');
      const textoStatus = document.getElementById('textoStatusMeta');

      if (!inputMeta || !barra || !textoStatus) return;

      const meta = Math.max(1, parseInt(inputMeta.value) || 1);
      const porcentagem = Math.min(100, Math.round((totalMoedasAcumuladas / meta) * 100));

      // Atualiza a largura da barra horizontal
      barra.style.width = `${porcentagem}%`;

      // Atualiza visual quando a meta é batida
      if (porcentagem >= 100) {
        barra.className = 'bg-gradient-to-r from-emerald-500 to-green-400 h-full rounded-full shadow-lg shadow-emerald-500/20';
        textoStatus.innerText = `${totalMoedasAcumuladas} / ${meta} (100% - META ATINGIDA!)`;
        textoStatus.className = 'font-bold text-emerald-400';
      } else {
        barra.className = 'bg-gradient-to-r from-yellow-500 to-amber-400 h-full rounded-full shadow-lg';
        textoStatus.innerText = `${totalMoedasAcumuladas} / ${meta} (${porcentagem}%)`;
        textoStatus.className = 'font-bold text-yellow-400';
      }
    }

    // 4. Desenhar Roleta (Canvas)
    const canvas = document.getElementById('roletaCanvas');
    const ctx = canvas.getContext('2d');

    function desenharRoleta() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const centro = canvas.width / 2;
      const raio = centro - 10;

      if (participantes.length === 0) {
        ctx.beginPath();
        ctx.arc(centro, centro, raio, 0, 2 * Math.PI);
        ctx.fillStyle = '#1f2937';
        ctx.fill();
        ctx.strokeStyle = '#374151';
        ctx.lineWidth = 4;
        ctx.stroke();

        ctx.fillStyle = '#9ca3af';
        ctx.font = 'bold 16px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('Aguardando participantes...', centro, centro);
        return;
      }

      const fatias = participantes.length;
      const anguloFatia = (2 * Math.PI) / fatias;
      const cores = ['#eab308', '#ca8a04', '#a16207', '#854d0e', '#713f12'];

      participantes.forEach((p, i) => {
        const anguloInicio = i * anguloFatia;
        const anguloFim = anguloInicio + anguloFatia;

        ctx.beginPath();
        ctx.moveTo(centro, centro);
        ctx.arc(centro, centro, raio, anguloInicio, anguloFim);
        ctx.fillStyle = cores[i % cores.length];
        ctx.fill();
        ctx.strokeStyle = '#111827';
        ctx.lineWidth = 2;
        ctx.stroke();

        // Nome
        ctx.save();
        ctx.translate(centro, centro);
        ctx.rotate(anguloInicio + anguloFatia / 2);
        ctx.textAlign = 'right';
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 14px sans-serif';
        ctx.fillText(p.nome || p.username, raio - 20, 5);
        ctx.restore();
      });
    }

    // Ações
    function realizarSorteio() {
      if (participantes.length === 0) {
        alert('Adicione ao menos 1 participante para realizar o sorteio!');
        return;
      }
      socket.emit('iniciarSorteio');
    }

    function limparParticipantes() {
      if (confirm('Tem certeza que deseja limpar todos os participantes?')) {
        db.ref('participantes').remove();
      }
    }
  </script>
</body>
</html>
